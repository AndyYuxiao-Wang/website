<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Election Map</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Roboto+Condensed:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- The interactive map -->
<div>

  <div id="election-controls">
    <button data-year="2005">2005</button>
    <button data-year="2010">2010</button>
    <button data-year="2015">2015</button>
    <button data-year="eu2016">2016 EU Ref</button>
    <button data-year="2017">2017</button>
    <button data-year="2019">2019</button>
    <button data-year="2024">2024</button>
    <button data-year="2029">Prediction</button>
    <button data-year="1">Notional 2019</button>
    <button data-year="custom" class="custom-predictor-btn">Custom</button>
    <button data-year="2016" class="segments-btn">Electorate Segments</button>
  </div>

  <div id="map-container">
    <button class="reset-btn" id="reset-btn">Reset View</button>
    <div class="zoom-controls">
      <button class="zoom-btn" id="zoom-in">+</button>
      <button class="zoom-btn" id="zoom-out">-</button>
    </div>

    <div id="conmap-slot"></div>
    <div id="conmap-2010-slot"></div>

  </div>

  <div id="results-panel" class="results-panel">
    <div class="rp-unavailable-message" id="rp-unavailable-message">Data not available for Northern Ireland</div>
    <div class="rp-top-row">
      <div class="rp-main-stack">
        <div class="rp-header">
          <div class="rp-gainhold" id="rp-gainhold"></div>
          <div class="rp-result-tag" id="rp-result-tag">RESULT</div>
        </div>

        <div class="rp-body">
          <div class="rp-chart-area">
            <div class="rp-chart-big" id="rp-chart-big"></div>
            <div class="rp-chart-mini-col" id="rp-chart-mini-col"></div>
          </div>
          <div class="rp-candidates" id="rp-candidates"></div>
        </div>

        <div class="rp-majority">
          <span class="rp-majority-label" id="rp-majority-label">MAJORITY</span>
          <span class="rp-majority-value" id="rp-majority-value"></span>
        </div>
      </div>

      <div class="rp-side">
        <div class="rp-extension-placeholder" id="rp-extension-placeholder">
          <div class="rp-ext-description" id="rp-ext-description"></div>
        </div>
        <div class="rp-extension-demographics" id="rp-extension-demographics">
          <div class="rp-ext-demo-header" id="rp-ext-demo-header">Demographics</div>
          <div class="rp-ext-demo-list" id="rp-ext-demo-list"></div>
          <div class="rp-ext-demo-footnotes" id="rp-ext-demo-footnotes"></div>
        </div>
        <div class="rp-extension-brexit" id="rp-extension-brexit">
          <div class="rp-ext-demo-header">
            Estimated 2016 EU Referendum
            <span class="info-tip-icon" data-info-text="Modelled Leave/Remain estimate for this constituency's pre-2024 boundaries - not an official result. Shown here instead of the profile/demographics tab, which is keyed to 2024 boundaries."></span>
          </div>
          <div class="rp-brexit-bar" id="rp-brexit-bar"></div>
          <div class="rp-brexit-labels" id="rp-brexit-labels"></div>
        </div>
      </div>
    </div>

    <div class="rp-turnout-row">
      <div class="rp-turnout">
        <span class="rp-turnout-label">TURNOUT</span>
        <span class="rp-turnout-value" id="rp-turnout-value"></span>
      </div>
      <div class="rp-turnout-change" id="rp-turnout-change"></div>
    </div>

    <div class="rp-name-ribbon" id="rp-name-ribbon"></div>
  </div>
</div>
<div id="overall-results" class="overall-results-panel"></div>
<div id="overall-voteshare" class="ort-voteshare"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.4/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="js/infoTip.js"></script>
<script src="js/app.js"></script>
<script src="js/chloro.js"></script>
<script src="js/demographics.js"></script>
<script src="js/customPredictor.js"></script>
</body>
</html>
